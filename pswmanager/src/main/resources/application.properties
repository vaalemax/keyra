spring.application.name=pswmanager
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Root logging level
logging.level.root=INFO
# Application logging level
logging.level.com.portfolio.pswmanager=INFO
# Spring framework logging
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
# Database logging
logging.level.org.hibernate.SQL=WARN

# Log file configuration
logging.file.name=logs/pswmanager.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Log patterns for console and file
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%t] %-40.40logger{39} : %m%n%wEx


server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=PSWMANAGER_SESSION

# Max file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Strict endpoints (login, register) - 5 requests per minute
rate-limit.strict.capacity=5
rate-limit.strict.refill-tokens=5
rate-limit.strict.refill-duration=1m

# Normal endpoints (vault operations) - 10 requests per minute
rate-limit.normal.capacity=10
rate-limit.normal.refill-tokens=10
rate-limit.normal.refill-duration=1m
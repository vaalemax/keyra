spring.application.name=pswmanager

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/pswmanager
spring.datasource.username=user
spring.datasource.password=user
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true


# Logging Configuration

# Root logging level
logging.level.root=INFO

# Application logging level
logging.level.com.portfolio.pswmanager=DEBUG

# Spring framework logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Database logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log file configuration
logging.file.name=logs/pswmanager.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Log pattern for console
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# Log pattern for file
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%t] %-40.40logger{39} : %m%n%wEx

# Session timeout (30 minutes)
server.servlet.session.timeout=30m

# Session tracking mode
server.servlet.session.tracking-modes=cookie

# Cookie settings
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=VAULTSHIELD_SESSION
spring.servlet.multipart.enabled=true

# Max file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Temp location for file uploads
spring.servlet.multipart.location=${java.io.tmpdir}

# ???????????????????????????????????????????????????????
# Rate Limiting Configuration
# ???????????????????????????????????????????????????????

# Strict endpoints (login, register) - 5 requests per minute
rate-limit.strict.capacity=5
rate-limit.strict.refill-tokens=5
rate-limit.strict.refill-duration=1m

# Normal endpoints (vault operations) - 10 requests per minute
rate-limit.normal.capacity=10
rate-limit.normal.refill-tokens=10
rate-limit.normal.refill-duration=1m
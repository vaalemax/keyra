databaseChangeLog:

  - changeSet:
      id: 001-create-users-table
      author: vale
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_username
              - column:
                  name: password_hash
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: encryption_key
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: two_factor_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: two_factor_secret
                  type: VARCHAR(32)
              - column:
                  name: backup_codes
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-credentials-table
      author: vale
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credentials
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: service_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: encrypted_password
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: VARCHAR(500)
              - column:
                  name: notes
                  type: VARCHAR(1000)
              - column:
                  name: category
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: credentials
            baseColumnNames: user_id
            constraintName: fk_credentials_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_credentials_user
            tableName: credentials
            columns:
              - column:
                  name: user_id

  - changeSet:
      id: 003-create-audit-logs-table
      author: vale
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_audit_logs
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: TEXT
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: VARCHAR(500)
              - column:
                  name: entity_type
                  type: VARCHAR(50)
              - column:
                  name: entity_id
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        # onDelete SET NULL, coerente con la scelta di preservare l'audit trail
        # anche dopo la cancellazione dell'utente (vedi discussione su cascade in User.auditLogs)
        - addForeignKeyConstraint:
            baseTableName: audit_logs
            baseColumnNames: user_id
            constraintName: fk_audit_logs_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL

        - createIndex:
            indexName: idx_audit_user
            tableName: audit_logs
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_audit_timestamp
            tableName: audit_logs
            columns:
              - column:
                  name: timestamp

        - createIndex:
            indexName: idx_audit_action
            tableName: audit_logs
            columns:
              - column:
                  name: action
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Login – Keyra</title>

    <th:block th:replace="~{fragments :: styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/login.css}">

</head>

<body>
<div class="login-page">

    <div class="login-page__bg">
        <div class="login-page__grid"></div>
        <div class="login-page__glow login-page__glow--1"></div>
        <div class="login-page__glow login-page__glow--2"></div>
    </div>

    <div class="login-container">

        <div class="login-logo">
            <div class="login-logo__icon">🔐</div>
            <span class="login-logo__text">Key<span>ra</span></span>
            <span class="login-logo__sub">Your credentials, in a safe space.</span>
        </div>

        <div class="login-card">

            <div th:replace="~{fragments :: messages}"></div>

            <div th:if="${param.error}" class="login-error">
                <span class="alert-icon">✕</span>
                <span>Username or password not valid. Check the details and try again.</span>
            </div>

            <div th:if="${param.timeout}" class="login-error" style="border-color: var(--warning); background: var(--warning-bg); color: var(--warning);">
                <span class="alert-icon">⚠</span>
                <span>Your session has expired. Please log in again.</span>
            </div>

            <div th:if="${param.logout}" class="alert alert-success" style="margin-bottom:18px;">
                <span class="alert-icon">✔</span>
                <span>Logout completed successfully.</span>
            </div>

            <form th:action="@{/login}" method="post" class="login-form" novalidate>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text"
                           id="username"
                           name="username"
                           th:value="${param.username}"
                           placeholder="Your username"
                           autocomplete="username"
                           required
                           autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Your master password"
                               autocomplete="current-password"
                               required>
                        <button type="button"
                                class="input-action"
                                onclick="togglePasswordVisibility('password', this)"
                                aria-label="Show/hide password">
                            👁
                        </button>
                    </div>
                </div>

                <div class="login-divider"><span>or</span></div>

                <button type="submit" class="btn btn-primary btn-lg btn-full btn-submit">
                    Log in
                </button>
            </form>

            <div class="login-footer">
                Don't have an account? <a th:href="@{/register}">Register</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>

</body>
</html>

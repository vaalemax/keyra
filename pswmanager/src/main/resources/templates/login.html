<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Login – VaultShield</title>

    <style th:replace="~{fragments :: styles}"></style>

    <style>
        .login-page {
            min-height:      100vh;
            display:         flex;
            align-items:     center;
            justify-content: center;
            position:        relative;
            overflow:        hidden;
            background:      var(--bg-base);
        }

        .login-page__bg {
            position:  absolute;
            inset:     0;
            z-index:   0;
            overflow:  hidden;
            pointer-events: none;
        }

        .login-page__grid {
            position:          absolute;
            inset:             -50%;
            width:             200%;
            height:            200%;
            background-image:  linear-gradient(var(--border) 1px, transparent 1px),
                               linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size:   60px 60px;
            opacity:           0.18;
            animation:         gridDrift 40s linear infinite;
        }
        @keyframes gridDrift {
            from { transform: translate(0, 0); }
            to   { transform: translate(60px, 60px); }
        }

        .login-page__glow {
            position:       absolute;
            border-radius:  50%;
            filter:         blur(100px);
            opacity:        0.18;
            animation:      glowPulse 6s ease-in-out infinite alternate;
        }
        .login-page__glow--1 {
            width: 420px; height: 420px;
            background: var(--accent);
            top: -120px; left: -100px;
        }
        .login-page__glow--2 {
            width: 320px; height: 320px;
            background: #3b82f6;
            bottom: -80px; right: -80px;
            animation-delay: 2s;
        }
        @keyframes glowPulse {
            from { opacity: 0.12; transform: scale(1);    }
            to   { opacity: 0.22; transform: scale(1.08); }
        }

        .login-container {
            position:   relative;
            z-index:    1;
            width:      90%;
            max-width:  420px;
            animation:  fadeUp .55s cubic-bezier(.22,1,.36,1) both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        .login-logo {
            display:         flex;
            flex-direction:  column;
            align-items:     center;
            gap:             14px;
            margin-bottom:   28px;
            animation:       fadeUp .55s cubic-bezier(.22,1,.36,1) .08s both;
        }
        .login-logo__icon {
            width:           56px;
            height:          56px;
            background:      var(--accent);
            border-radius:   16px;
            display:         flex;
            align-items:     center;
            justify-content: center;
            font-size:       1.7rem;
            box-shadow:      var(--shadow-glow);
        }
        .login-logo__text {
            font-size:      1.5rem;
            font-weight:    700;
            color:          var(--text-primary);
            letter-spacing: -.02em;
        }
        .login-logo__text span { color: var(--accent); }

        .login-logo__sub {
            font-size: .82rem;
            color:     var(--text-muted);
            margin-top: -8px;
        }

        .login-card {
            background:    var(--bg-card);
            border:        1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow:    var(--shadow-card);
            padding:       32px 28px 28px;
            animation:     fadeUp .55s cubic-bezier(.22,1,.36,1) .12s both;
        }

        .login-form .form-group {
            animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both;
        }
        .login-form .form-group:nth-child(1) { animation-delay: .18s; }
        .login-form .form-group:nth-child(2) { animation-delay: .24s; }

        .login-form .btn-submit {
            animation: fadeUp .5s cubic-bezier(.22,1,.36,1) .32s both;
        }

        .login-divider {
            display:        flex;
            align-items:    center;
            gap:            12px;
            margin:         4px 0 18px;
            animation:      fadeUp .5s cubic-bezier(.22,1,.36,1) .20s both;
        }
        .login-divider::before,
        .login-divider::after {
            content:  '';
            flex:     1;
            height:   1px;
            background: var(--border);
        }
        .login-divider span {
            font-size: .75rem;
            color:     var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .08em;
            white-space: nowrap;
        }

        .login-footer {
            text-align:    center;
            margin-top:    22px;
            font-size:     .82rem;
            color:         var(--text-muted);
            animation:     fadeUp .5s cubic-bezier(.22,1,.36,1) .38s both;
        }
        .login-footer a {
            color:      var(--accent);
            font-weight: 600;
            transition: color var(--transition);
        }
        .login-footer a:hover { color: var(--accent-hover); }

        .login-error {
            background:    var(--error-bg);
            border:        1px solid var(--error);
            border-radius: var(--radius);
            color:         var(--error);
            padding:       12px 16px;
            font-size:     .85rem;
            display:       flex;
            align-items:   flex-start;
            gap:           10px;
            margin-bottom: 18px;
            animation:     slideDown .25s ease;
        }
        .login-error .alert-icon { flex-shrink: 0; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        @media (max-width: 480px) {
            .login-card           { padding: 24px 18px 22px; }
            .login-logo__icon     { width: 48px; height: 48px; font-size: 1.4rem; }
            .login-logo__text     { font-size: 1.25rem; }
        }
    </style>
</head>

<body>
<div class="login-page">

    <div class="login-page__bg">
        <div class="login-page__grid"></div>
        <div class="login-page__glow login-page__glow--1"></div>
        <div class="login-page__glow login-page__glow--2"></div>
    </div>

    <div class="login-container">

        <div class="login-logo">
            <div class="login-logo__icon">🔐</div>
            <span class="login-logo__text">Vault<span>Shield</span></span>
            <span class="login-logo__sub">Le tue credenziali, al sicuro.</span>
        </div>

        <div class="login-card">

            <div th:replace="~{fragments :: messages}"></div>

            <div th:if="${param.error}" class="login-error">
                <span class="alert-icon">✕</span>
                <span>Username or password not valid. Check the details and try again.</span>
            </div>

            <div th:if="${param.timeout}" class="login-error" style="border-color: var(--warning); background: var(--warning-bg); color: var(--warning);">
                <span class="alert-icon">⚠</span>
                <span>Your session has expired. Please log in again.</span>
            </div>

            <div th:if="${param.logout}" class="alert alert-success" style="margin-bottom:18px;">
                <span class="alert-icon">✔</span>
                <span>Logout completed successfully.</span>
            </div>

            <form th:action="@{/login}" method="post" class="login-form" novalidate>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text"
                           id="username"
                           name="username"
                           th:value="${param.username}"
                           placeholder="Your username"
                           autocomplete="username"
                           required
                           autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Your master password"
                               autocomplete="current-password"
                               required>
                        <button type="button"
                                class="input-action"
                                onclick="togglePasswordVisibility('password', this)"
                                aria-label="Show/hide password">
                            👁
                        </button>
                    </div>
                </div>

                <div class="login-divider"><span>or</span></div>

                <button type="submit" class="btn btn-primary btn-lg btn-full btn-submit">
                    Log in
                </button>
            </form>

            <div class="login-footer">
                Don't have an account? <a th:href="@{/register}">Register</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>

</body>
</html>

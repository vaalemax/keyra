<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style th:replace="~{fragments :: styles}"></style>

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-base);
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .error-message {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>

<body>
<div class="error-page">
    <div class="error-icon">🔍</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">
        Ops! The page you are looking for does not exist.
        <br>
        <span style="font-size: .85rem; color: var(--text-tertiary);" th:if="${requestUri}">
                Requested url: <code th:text="${requestUri}"></code>
            </span>
    </p>

    <div class="error-actions">
        <a th:href="@{/vault}" class="btn btn-primary">
            🏠 Go back to Vault
        </a>
        <a href="javascript:history.back()" class="btn btn-secondary">
            ← Go back
        </a>
    </div>
</div>
</body>
</html>

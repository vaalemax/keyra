<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication – Keyra</title>
    <style th:replace="~{fragments :: styles}"></style>
    <link rel="stylesheet" th:href="@{/css/login/two-factor-verify.css}">

</head>

<body>

<div th:replace="~{fragments :: navbar}"></div>

<main class="verify-page">
    <div class="verify-container">

        <div class="verify-card">

            <div class="verify-header">
                <span class="verify-header__icon">🔐</span>
                <h1 class="verify-header__title">Two-Factor Authentication</h1>
                <p class="verify-header__subtitle">
                    Enter the 6-digit code from your authenticator app
                </p>
            </div>

            <div th:replace="~{fragments :: messages}"></div>

            <form th:action="@{/login/2fa/verify}"
                  method="post"
                  id="totpForm"
                  class="totp-form">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="useBackupCode" value="false"/>

                <div class="form-group">
                    <input type="text"
                           id="totpCode"
                           name="code"
                           class="code-input"
                           placeholder="000000"
                           maxlength="6"
                           pattern="[0-9]{6}"
                           autocomplete="off"
                           required
                           autofocus>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Verify Code
                </button>
            </form>

            <form th:action="@{/login/2fa/verify}"
                  method="post"
                  id="backupForm"
                  class="backup-form">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="useBackupCode" value="true"/>

                <div class="form-group">
                    <label for="backupCode">Backup Code</label>
                    <input type="text"
                           id="backupCode"
                           name="code"
                           class="code-input"
                           placeholder="12345678"
                           maxlength="8"
                           pattern="[0-9]{8}"
                           autocomplete="off"
                           style="letter-spacing: .2em;">
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Use Backup Code
                </button>

                <div class="backup-link">
                    <a onclick="toggleBackupForm()">Use authenticator app instead</a>
                </div>
            </form>

            <div class="backup-link totp-link">
                <a onclick="toggleBackupForm()">Lost your phone? Use a backup code</a>
            </div>
        </div>

        <p style="text-align: center; margin-top: 24px; font-size: .85rem; color: var(--text-muted);">
            <a th:href="@{/login.html}" style="color: var(--accent);">← Back to Login</a>
        </p>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>

<script th:src="@{/js/login/two-factor-verify.js}"></script>

</body>
</html>

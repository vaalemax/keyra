services:

  db:
    image: postgres:16-alpine
    container_name: keyra-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keyra}
      POSTGRES_USER: ${POSTGRES_USER:-keyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - keyra-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keyra} -d ${POSTGRES_DB:-keyra}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - keyra-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyra-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-keyra}
      DB_USERNAME: ${POSTGRES_USER:-keyra}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    networks:
      - keyra-network

networks:
  keyra-network:
    driver: bridge

volumes:
  keyra-db-data:
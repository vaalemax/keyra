<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style th:replace="~{fragments :: styles}"></style>
    <style>
        .error-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; background: var(--bg-base); }
        .error-code { font-size: 6rem; font-weight: 900; color: var(--text-muted); line-height: 1; margin-bottom: 20px; }
        .error-title { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; }
        .error-message { font-size: 1rem; color: var(--text-muted); max-width: 500px; margin-bottom: 32px; line-height: 1.6; }
        .error-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .error-icon { font-size: 4rem; margin-bottom: 20px; }
    </style>
</head>

<body>
<div class="error-page">
    <div class="error-icon">🤔</div>
    <div class="error-code" th:text="${statusCode} ?: 'ERROR'"></div>
    <h1 class="error-title">An error occured</h1>
    <p class="error-message">
        <span th:text="${errorMessage} ?: 'Something went wrong.'"></span>
    </p>

    <div class="error-actions">
        <a th:href="@{/vault}" class="btn btn-primary">
            🏠 Go back to Vault
        </a>
    </div>
</div>
</body>
</html>
